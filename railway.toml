# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code

[build]
# Build from the Dockerfile at the repository root
dockerfilePath = "Dockerfile"

[deploy]
# Railway sets $PORT automatically — uvicorn reads it via the CMD in Dockerfile
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "ai-auto-company"
