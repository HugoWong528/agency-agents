# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code

[build]
# Build from the Dockerfile at the repository root
dockerfilePath = "Dockerfile"

[deploy]
# Railway sets $PORT automatically — uvicorn reads it via the CMD in Dockerfile
startCommand = "sh -c 'uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Health check — Railway calls this to confirm the service is up
[[services]]
name = "ai-auto-company"
